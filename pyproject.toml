[project]
name = "quant-forge"
version = "0.1.0"
description = "C++ backtesting engine + Python data pipeline"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "requests>=2.31",
    "pyarrow>=15.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true
